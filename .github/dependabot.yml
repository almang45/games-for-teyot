version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
    ignore:
      # TS 7 has no JS compiler API and typescript-eslint wants <6.1; lift once it supports 7 (#7).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
