# docs/ARCHITECTURE.md §9: lint → test → build → validate + e2e → SAST → quality gate → deploy.
# Every action is pinned by commit SHA; the trailing comment names the release.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Includes the size budget and the privacy check (US-PRIV-01).
      - run: npm run build
        env:
          APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  # AGENTS.md: design/, ui/ and assets/ validate against contracts/ (tools/validate).
  validate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate

  # Tests the exact artifact that deploys, served by `vite preview` with the production headers.
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Semgrep CE (LGPL engine, Semgrep Registry rules): CodeQL's licence doesn't cover private repos
  # without GitHub Code Security. The image is pinned by digest like the actions.
  semgrep:
    needs: [e2e, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/src" -w /src \
            -e HOME=/tmp \
            semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 \
            semgrep scan --config p/default --config p/typescript --metrics=off \
              --error --sarif-output=semgrep.sarif src tools
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14
          if-no-files-found: ignore

  osv-scanner:
    needs: [e2e, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

  quality-gate:
    needs: [semgrep, osv-scanner]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      # The gate blocks the pipeline: no token means no gate, which is a failure, not a skip.
      # Dependabot PRs read Dependabot secrets, so SONAR_TOKEN must be set there too.
      - name: Check SonarQube Cloud token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::SONAR_TOKEN is not set (Actions secrets, and Dependabot secrets for Dependabot PRs); the quality gate cannot run."
            exit 1
          fi
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  # Off unless the repo variable PREVIEW_DEPLOYS is "enabled". A pull_request run executes the PR's
  # own workflow file, and no Cloudflare token can upload versions without also being able to
  # deploy, so the token must never be readable from PR runs by default. To enable: give the
  # `preview` environment required reviewers and its own environment-scoped token first.
  deploy-preview:
    if: github.event_name == 'pull_request' && vars.PREVIEW_DEPLOYS == 'enabled'
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: preview
    steps:
      - name: Check the Worker exists
        id: pre
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: rumah-cici-theia
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::PREVIEW_DEPLOYS is enabled but the preview environment has no Cloudflare secrets."
            exit 1
          fi
          # Preview versions need an existing Worker; the first one is created by the master deploy.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          case "${status}" in
            200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "::warning::Worker ${WORKER_NAME} does not exist yet; preview deploy skipped until the first master deploy."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Cloudflare API returned HTTP ${status} looking up ${WORKER_NAME}; check the token scope."
              exit 1
              ;;
          esac
      - if: steps.pre.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.pre.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.pre.outputs.enabled == 'true'
        run: npm ci
      - if: steps.pre.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Preview versions do not take traffic; the URL sits behind Access like production.
      - if: steps.pre.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # GITHUB_SHA on a PR is a temporary merge commit; the build stamps the head SHA too.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} ${HEAD_SHA::7}"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://rct.amns.my.id
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # `needs: quality-gate` already stops this job when the gate fails. The token is a secret of
      # the `production` environment, which only master may use (deployment branch policy).
      - name: Check the deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on the production environment; production cannot deploy."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Rollback: `npx wrangler rollback <version-id>` (ARCHITECTURE §8.4).
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "master ${GITHUB_SHA::7}"
