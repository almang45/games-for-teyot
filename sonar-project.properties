sonar.organization=almang45
sonar.projectKey=almang45_games-for-teyot
sonar.projectName=Rumah Cici Theia

# ui/ is in lcov (vitest covers it) but not a Sonar source: SonarJS doesn't analyse .svelte, and
# ui/ is Antigravity's lane, reviewed in its own PRs (AGENTS.md).
sonar.sources=src,tools,contracts
sonar.tests=tests
sonar.exclusions=**/*.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Must equal COVERAGE_EXCLUDE in tools/build/coverage.ts (tests/unit/coverage-config.test.ts).
sonar.coverage.exclusions=src/main.ts,src/scenes/**,src/game/createGame.ts,src/**/*.d.ts,tools/build/check-budget.mjs,tools/build/check-private.mjs,tools/validate/validate-*.ts,tools/validate/write-schemas.ts,tools/dev/**,tools/proto/**,tools/house/blockout.ts,tools/inputs/check.ts,tools/inputs/frames.ts,tools/sprites/cli.ts,tools/strokes/synthesize.ts
